name: Run study

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q

      - name: Run the full study (simulate, checks, analysis, memo)
        run: python run_all.py

      - name: Check results match the committed ones
        run: |
          git diff --stat -- results/summary.json
          if ! git diff --quiet -- results/summary.json; then
            echo "::warning::results/summary.json differs from the committed version"
          fi

      - name: Upload results and report
        uses: actions/upload-artifact@v4
        with:
          name: study-output
          path: |
            results/
            report/
