# Column mapping for the raw metro ridership files.
#
# Filled in for the SIMULATED raw format (scripts/simulate_ridership.py --raw-days).
# For real data, inspect a raw file and update this mapping:
#   python scripts/download_and_aggregate.py inspect <path-to-one-raw-file>
#
# Use either `timestamp` (one datetime column) OR `date` + `time` (two columns).
# Leave the unused option as null.

columns:
  origin: Entry Station
  destination: Exit Station
  timestamp: null
  date: Transaction Date
  time: Transaction Time

# Optional SQL filter applied to raw rows before aggregation, written in DuckDB
# SQL against the raw column names. All raw columns are read as text, so cast
# numbers explicitly, e.g. "CAST(amount AS DOUBLE) > 0".
row_filter: "\"Mode\" = 'Metro'"

# Date/time formats (DuckDB strptime codes, e.g. "%Y-%m-%d", "%H:%M:%S",
# "%d/%m/%Y %H:%M"). Set them whenever the format is not ISO (YYYY-MM-DD).
# Getting dd/mm vs mm/dd wrong silently corrupts the data, so always set them.
date_format: "%d/%m/%Y"
time_format: "%H:%M:%S"
timestamp_format: null
